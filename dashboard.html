<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #2f2f2f;
      font-family: Arial, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      background-color: #f5f5f0;
      padding: 25px;
      border-radius: 10px;
      max-width: 1000px;
      margin: 0 auto 20px auto;
    }

    h2 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
      color: #2f2f2f;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .input-group input, .input-group select {
      flex: 1;
      min-width: 150px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    .input-group button {
      padding: 10px 20px;
      background: #2f2f2f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #2f2f2f;
      color: white;
    }

    tr:hover {
      background: #eaeae5;
    }

    .actions button {
      padding: 5px 10px;
      margin-right: 5px;
      cursor: pointer;
      border: none;
      border-radius: 3px;
      font-size: 12px;
    }

    .edit-btn {
      background: #2f2f2f;
      color: white;
    }

    .delete-btn {
      background: #c0392b;
      color: white;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .status-done { background: #27ae60; color: white; }
    .status-progress { background: #f39c12; color: white; }
    .status-cancelled { background: #c0392b; color: white; }

    /* Chart Section */
    .chart-container {
      background-color: #f5f5f0;
      padding: 25px;
      border-radius: 10px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .chart-container h3 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #2f2f2f;
    }

    .chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 200px;
      padding: 20px 10px;
      background: white;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    .bar-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .bar {
      width: 40px;
      background: #2f2f2f;
      border-radius: 4px 4px 0 0;
      transition: height 0.3s;
    }

    .bar-label {
      margin-top: 8px;
      font-size: 12px;
      color: #333;
    }

    .bar-value {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Task Dashboard</h2>

  <!-- Input Form -->
  <div class="input-group">
    <input type="hidden" id="editIndex">
    <input type="text" id="nameInput" placeholder="Nama">
    <input type="text" id="taskInput" placeholder="Task">
    <input type="date" id="dateInput">
    <select id="statusInput">
      <option value="on-progress">On Progress</option>
      <option value="done">Done</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <button onclick="saveTask()" id="saveBtn">Add</button>
  </div>

  <!-- Task Table -->
  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Nama</th>
        <th>Task</th>
        <th>Tanggal</th>
        <th>Status</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="taskTable"></tbody>
  </table>
</div>

<!-- Bar Chart -->
<div class="chart-container">
  <h3>Distribusi Task per User</h3>
  <div class="chart" id="chart"></div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function renderTasks() {
    const taskTable = document.getElementById("taskTable");
    taskTable.innerHTML = "";

    if (tasks.length === 0) {
      taskTable.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:20px;color:#666;">Belum ada task!</td></tr>`;
      return;
    }

    tasks.forEach((task, index) => {
      const statusClass = task.status === 'done' ? 'status-done' : task.status === 'cancelled' ? 'status-cancelled' : 'status-progress';
      const statusText = task.status === 'done' ? 'Done' : task.status === 'cancelled' ? 'Cancelled' : 'On Progress';
      
      taskTable.innerHTML += `
        <tr>
          <td>${index + 1}</td>
          <td>${task.name}</td>
          <td>${task.task}</td>
          <td>${task.date}</td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          <td>
            <button class="edit-btn" onclick="editTask(${index})">Edit</button>
            <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
          </td>
        </tr>
      `;
    });
  }

  function renderChart() {
    const chart = document.getElementById("chart");
    chart.innerHTML = "";

    // Count tasks per user
    const userCounts = {};
    tasks.forEach(task => {
      userCounts[task.name] = (userCounts[task.name] || 0) + 1;
    });

    const users = Object.keys(userCounts);
    const maxCount = Math.max(...Object.values(userCounts), 1);

    if (users.length === 0) {
      chart.innerHTML = "<p style='text-align:center;color:#666;width:100%;'>Belum ada data!</p>";
      return;
    }

    users.forEach(user => {
      const count = userCounts[user];
      const height = (count / maxCount) * 150;
      
      chart.innerHTML += `
        <div class="bar-group">
          <div class="bar-value">${count}</div>
          <div class="bar" style="height: ${height}px;"></div>
          <div class="bar-label">${user}</div>
        </div>
      `;
    });
  }

  function saveTask() {
    const editIndex = document.getElementById("editIndex").value;
    const name = document.getElementById("nameInput").value.trim();
    const task = document.getElementById("taskInput").value.trim();
    const date = document.getElementById("dateInput").value;
    const status = document.getElementById("statusInput").value;

    if (!name || !task || !date) {
      alert("Mohon isi semua field!");
      return;
    }

    if (editIndex !== "") {
      tasks[editIndex] = { name, task, date, status };
      document.getElementById("editIndex").value = "";
      document.getElementById("saveBtn").textContent = "Add";
    } else {
      tasks.push({ name, task, date, status });
    }

    saveTasks();
    renderTasks();
    renderChart();
    clearInputs();
  }

  function editTask(index) {
    const task = tasks[index];
    document.getElementById("editIndex").value = index;
    document.getElementById("nameInput").value = task.name;
    document.getElementById("taskInput").value = task.task;
    document.getElementById("dateInput").value = task.date;
    document.getElementById("statusInput").value = task.status || "on-progress";
    document.getElementById("saveBtn").textContent = "Update";
  }

  function deleteTask(index) {
    if (confirm("Yakin hapus task ini?")) {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
      renderChart();
    }
  }

  function clearInputs() {
    document.getElementById("nameInput").value = "";
    document.getElementById("taskInput").value = "";
    document.getElementById("dateInput").value = "";
    document.getElementById("statusInput").value = "on-progress";
  }

  // Initial render
  renderTasks();
  renderChart();
</script>

</body>
</html>
