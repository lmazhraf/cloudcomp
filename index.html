<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2f2f2f; /* Dark Grey */
            font-family: Arial, sans-serif;
        }

        .container {
            background-color: #f5f5f0; /* Broken White */
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #2f2f2f;
        }

        .subtitle {
            font-size: 12px;
            margin-bottom: 20px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #2f2f2f;
            color: #f5f5f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        ul {
            margin-top: 20px;
            text-align: left;
            list-style: none;
        }

        li {
            padding: 10px;
            background-color: #eaeae5;
            margin-bottom: 8px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Cloud Computing</h1>
        <p class="subtitle">2450232001</p>

        <!-- FORM INPUT -->
        <input id="nameInput" placeholder="Nama">
        <input id="taskInput" placeholder="Task">
        <input type="date" id="dateInput">

        <button onclick="addTask()">Tambah Task</button>

        <!-- LIST -->
        <ul id="taskList"></ul>
    </div>

    <!-- WAJIB pakai module -->
    <script type="module" src="assets/js/main.js"></script>

</body>
</html>
